[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat"]

[project]
name = "nemo-agent-toolkit-tavily"
version = "0.2.0"
requires-python = ">=3.11,<3.14"
description = "Tavily integration for NVIDIA NeMo Agent Toolkit"
readme = "README.md"
keywords = ["ai", "agents", "web search", "tavily", "nemo-agent-toolkit", "nvidia-nat"]
license = { text = "Apache-2.0" }
authors = [{ name = "Tavily", email = "support@tavily.com" }]
maintainers = [{ name = "Tavily" }]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "nvidia-nat-core >= 1.8",
  "tavily-python >= 0.7.0, < 1.0.0",
]

[project.optional-dependencies]
test = [
  "pytest >= 8.0",
  "pytest-asyncio >= 0.24",
  "nvidia-nat-test >= 1.8",
]

[project.urls]
documentation = "https://docs.nvidia.com/nemo/agent-toolkit/latest/"
source = "https://github.com/tavily-ai/NeMo-Agent-Toolkit-tavily"

[project.entry-points.'nat.plugins']
nat_tavily = "nat.plugins.tavily.register"

[tool.pytest.ini_options]
asyncio_mode = "auto"
