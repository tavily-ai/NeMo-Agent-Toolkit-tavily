[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat_tavily_weather"]

[project]
name = "nat_tavily_weather"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "Tavily + LangChain ReAct + Anthropic example workflow"
keywords = ["ai", "agents", "tavily", "anthropic"]
classifiers = ["Programming Language :: Python"]

dependencies = [
  "nvidia-nat[langchain] >= 1.8",
  "nemo-agent-toolkit-tavily",
]

[tool.uv.sources]
nemo-agent-toolkit-tavily = { path = "../..", editable = true }
